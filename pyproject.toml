[project]
name = "enpkg"
version = "0.0.2"
description = "ENPKG FULL"
authors = [
    {name = "Pierre-Marie Allard", email= "pierre-marie.allard@unifr.ch"},
    {name = "Loïc Le Grégam", email = "Loic.Legregam@unige.ch"}
]
license = "GPL-3.0-only"
readme = "README.md"
# 3.14.1 is excluded because networkx declares `!=3.14.1` — that CPython patch
# release shipped a regression it cannot support. Use 3.14.0 or 3.14.2+.
requires-python = ">=3.13,!=3.14.1,<3.15"
dependencies = [
    "downloaders>=1.0.22,<2",
    "duckdb>=1.5.1,<2",
    # Held below 0.21: matchms 0.27+ pins scipy<1.17 and networkx<3.5, which
    # would drag the numeric stack backwards. 0.20 leaves its dependencies
    # unbounded, which is what lets this project run pandas 3 and scipy 1.17.
    "matchms>=0.20.0,<0.21",
    "matplotlib>=3.10.8,<4",
    "networkx>=3.6.1,<4",
    "numba>=0.63.1,<0.64",
    "numpy>=2.3.5,<3",
    "pandas>=3.0.0,<4",
    "polars>=1.39.3,<2",
    "psutil>=7.2.2,<8",
    # No direct import: pyarrow backs DuckDB's zero-copy Arrow exchange with
    # Polars in the loaders.
    "pyarrow>=23.0.1,<24",
    "pydantic>=2.12.5,<3",
    "python-dotenv>=1.2.2,<2",
    "pyyaml>=6.0.3,<7",
    "rdflib>=7.5.0,<8",
    "requests>=2.32.5,<3",
    "tqdm>=4.67.2,<5",
]

[project.urls]
homepage = "https://github.com/enpkg/enpkg_full"
repository = "https://github.com/enpkg/enpkg_full"
documentation = "https://github.com/enpkg/enpkg_full"

[tool.poetry]
packages = [
    {include = "monolith", from = "enpkg"}
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
ruff = "^0.15"
pre-commit = "^4.0"

[tool.poetry.group.gui]
optional = true

[tool.poetry.group.gui.dependencies]
streamlit = "^1.37"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs/vocab"]

[tool.ruff.lint]
# F = pyflakes (unused imports/names), I = import sorting, B = bugbear,
# E/W = pycodestyle. E501 (line length) is left to judgement. `UP` (pyupgrade)
# is intentionally omitted for now to avoid a large annotation-style churn.
select = ["F", "I", "E", "W", "B"]
ignore = [
    "E501",  # long lines (many descriptive strings / SQL); not worth churn
    "E741",  # ambiguous names like `l` appear in the math kernels
    "B008",  # calls in arg defaults — pydantic Field(...) is idiomatic here
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files intentionally re-export names.
"**/__init__.py" = ["F401"]
# The label-propagation numba kernel favours explicit numeric style.
"enpkg/monolith/utils/label_propagation_algorithm.py" = ["E", "W", "B"]

[tool.ruff.lint.isort]
known-first-party = ["enpkg"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"