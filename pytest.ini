[pytest]
# Put the repo root on sys.path so `import enpkg...` works regardless of how
# pytest is launched (the `pytest` console script — e.g. `poetry run pytest` in
# CI — does not add the CWD, and the package is installed with --no-root).
pythonpath = .
# Quiet by default. When debugging a single test, re-enable live logs with:
#   pytest -o log_cli=true --log-cli-level=DEBUG <path>
log_cli = false
markers =
    integration: exercises the DuckDB database, network access, or external tools (deselect with -m "not integration")
