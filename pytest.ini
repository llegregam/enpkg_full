[pytest]
# Put the repo root on sys.path so `import enpkg...` works regardless of how pytest is
# launched: the `pytest` console script does not add the CWD, and the tests are excluded
# from the installed package, so `enpkg.tests` is only importable from the repository.
pythonpath = .
# Quiet by default. When debugging a single test, re-enable live logs with:
#   pytest -o log_cli=true --log-cli-level=DEBUG <path>
log_cli = false
markers =
    integration: exercises the DuckDB database, network access, or external tools (deselect with -m "not integration")
# The NiceGUI `user` fixture is async. Without a mode set, pytest-asyncio ignores a bare
# `async def test_*`, and pytest then reports it as skipped rather than failed — a test
# that never runs but never complains either.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# The NiceGUI `user` fixture clears the route table, then imports this file to rebuild
# it, so each test starts from freshly registered pages. Importing the package is what
# runs the @ui.page decorators.
main_file = enpkg/tests/test_webui/nicegui_entry.py
